name: Update security feeds

# Refreshes data/*.json (CISA KEV, NVD, regional CERT and news feeds) so the
# portfolio's dashboard, briefing and news sections show current data.
on:
  # Reliable trigger: an external cron service (e.g. cron-job.org) POSTs a
  # repository_dispatch of type "refresh-feeds" every 2 hours — GitHub honours
  # these immediately, unlike `schedule` which it throttles heavily.
  repository_dispatch:
    types: [refresh-feeds]
  # Backup only: GitHub's built-in cron is best-effort and often delayed.
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch feeds
        run: node scripts/fetch-feeds.mjs
      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update security feed data"
          git push
