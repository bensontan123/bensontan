name: Update security feeds

# Refreshes data/*.json (CISA KEV, NVD, regional CERT and news feeds) so the
# portfolio's dashboard, briefing and news sections show current data.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch feeds
        run: node scripts/fetch-feeds.mjs
      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update security feed data"
          git push
